<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="robots" content="noindex" />

    />
    <meta

      content="#0e1014"

    />
    <meta

    <title>404 — Сторінку не знайдено | Mykola Kiianovskyi</title>
    <style>
      @font-face {
        font-family: "Onest";
        font-style: normal;
        font-weight: 100 900;
        font-display: swap;
        src: url("https://nick-kiianovskyi.github.io/portfolio/fonts/onest-cyrillic.woff2")
          format("woff2");
        unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
      }
      @font-face {
        font-family: "Onest";
        font-style: normal;
        font-weight: 100 900;
        font-display: swap;
        src: url("https://nick-kiianovskyi.github.io/portfolio/fonts/onest-latin.woff2")
          format("woff2");
        unicode-range:
          U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC,
          U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193,
          U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: "Literata";
        font-style: normal;
        font-weight: 200 900;
        font-display: swap;
        src: url("https://nick-kiianovskyi.github.io/portfolio/fonts/literata-cyrillic.woff2")
          format("woff2");
        unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
      }
      @font-face {
        font-family: "Literata";
        font-style: normal;
        font-weight: 200 900;
        font-display: swap;
        src: url("https://nick-kiianovskyi.github.io/portfolio/fonts/literata-latin.woff2")
          format("woff2");
        unicode-range:
          U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC,
          U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193,
          U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: "JetBrains Mono";
        font-style: normal;
        font-weight: 100 800;
        font-display: swap;
        src: url("https://nick-kiianovskyi.github.io/portfolio/fonts/jetbrains-mono-cyrillic.woff2")
          format("woff2");
        unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
      }
      @font-face {
        font-family: "JetBrains Mono";
        font-style: normal;
        font-weight: 100 800;
        font-display: swap;
        src: url("https://nick-kiianovskyi.github.io/portfolio/fonts/jetbrains-mono-latin.woff2")
          format("woff2");
        unicode-range:
          U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC,
          U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193,
          U+2212, U+2215, U+FEFF, U+FFFD;
      }

      :root {
        color-scheme: light dark;
        --color-bg: light-dark(#f4f1ea, #0e1014);
        --color-surface: light-dark(#ebe7de, #171a20);
        --color-text: light-dark(#17181a, #f2f0ea);
        --color-text-muted: light-dark(#5d6059, #a6a79f);
        --color-accent: light-dark(#3d5a00, #c6f24e);
        --color-accent-fill: #c6f24e;
        --color-on-accent: #101208;
        --color-border: light-dark(#d6d0c4, #2a2f38);
        --color-grid: light-dark(
          rgba(23, 24, 26, 0.045),
          rgba(242, 240, 234, 0.035)
        );
        --radius-sm: 0.5rem;
        --radius-lg: 1.25rem;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem 1rem;
        background-color: var(--color-bg);
        background-image:
          linear-gradient(to right, var(--color-grid) 1px, transparent 1px),
          linear-gradient(to bottom, var(--color-grid) 1px, transparent 1px);
        background-size: 4rem 4rem;
        color: var(--color-text);
        font-family:
          "Onest",
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        line-height: 1.6;
      }
      main {
        width: 100%;
        max-width: 40rem;
        padding: 2rem;
        background-color: var(--color-surface);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-lg);
      }
      .code {
        margin: 0 0 0.5rem;
        color: var(--color-accent);
        font-family: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
        font-size: 1rem;
        font-weight: 500;
        letter-spacing: 0.14em;
      }
      h1 {
        margin: 0 0 0.25rem;
        font-family: "Literata", Georgia, serif;
        font-size: clamp(1.75rem, 1.3rem + 2vw, 2.75rem);
        font-weight: 600;
        line-height: 1.1;
        letter-spacing: -0.02em;
      }
      .subtitle {
        margin: 0 0 1.5rem;
        color: var(--color-text-muted);
      }
      p {
        margin: 0 0 1rem;
      }
      a {
        color: var(--color-accent);
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        margin-top: 1.5rem;
      }
      .btn {
        display: inline-block;
        padding: 0.6rem 1.1rem;
        border: 1px solid var(--color-accent);
        border-radius: var(--radius-sm);
        color: var(--color-accent);
        font-weight: 600;
        text-decoration: none;
      }
      .btn-primary {
        background-color: var(--color-accent-fill);
        border-color: var(--color-accent-fill);
        color: var(--color-on-accent);
      }
      .btn:hover,
      .btn:focus {
        text-decoration: underline;
        text-decoration-thickness: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <section aria-labelledby="not-found-heading">
        <p class="code">404</p>
        <h1 id="not-found-heading">Сторінку не знайдено</h1>
        <p class="subtitle">Page not found</p>
        <p>
          Такої сторінки не існує. Перейдіть на
          <a href="https://nick-kiianovskyi.github.io/portfolio/">головну</a>
          або на
          <a href="https://nick-kiianovskyi.github.io/portfolio/en/"
            >English version</a
          >.
        </p>
        <p>
          This page does not exist. Go to the
          <a href="https://nick-kiianovskyi.github.io/portfolio/en/"
            >home page</a
          >.
        </p>
        <div class="actions">
          <a
            class="btn btn-primary"
            href="https://nick-kiianovskyi.github.io/portfolio/"
            >На головну</a
          >
          <a class="btn" href="https://nick-kiianovskyi.github.io/portfolio/en/"
            >Home (EN)</a
          >
        </div>
      </section>
    </main>
  </body>
</html>
