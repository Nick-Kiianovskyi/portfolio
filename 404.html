<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>404 — Сторінку не знайдено | Mykola Kiianovskyi</title>
    <style>
      :root {
        color-scheme: dark;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem 1rem;
        background-color: #12141a;
        color: #e6e8ee;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        line-height: 1.6;
      }
      main {
        width: 100%;
        max-width: 40rem;
        padding: 2rem;
        background-color: #1c1f28;
        border: 1px solid #2c3140;
        border-radius: 0.9rem;
      }
      .code {
        margin: 0 0 0.5rem;
        color: #6ea8fe;
        font-size: 1.25rem;
        font-weight: 700;
        letter-spacing: 0.08em;
      }
      h1 {
        margin: 0 0 0.25rem;
        font-size: clamp(1.5rem, 6vw, 2rem);
        line-height: 1.25;
      }
      .subtitle {
        margin: 0 0 1.5rem;
        color: #9aa1b0;
      }
      p {
        margin: 0 0 1rem;
      }
      a {
        color: #6ea8fe;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        margin-top: 1.5rem;
      }
      .btn {
        display: inline-block;
        padding: 0.6rem 1.1rem;
        border: 1px solid #6ea8fe;
        border-radius: 0.5rem;
        color: #6ea8fe;
        font-weight: 600;
        text-decoration: none;
      }
      .btn-primary {
        background-color: #6ea8fe;
        color: #12141a;
      }
      .btn:hover,
      .btn:focus {
        text-decoration: underline;
        text-decoration-thickness: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <section aria-labelledby="not-found-heading">
        <p class="code">404</p>
        <h1 id="not-found-heading">Сторінку не знайдено</h1>
        <p class="subtitle">Page not found</p>
        <p>
          Такої сторінки не існує. Перейдіть на
          <a href="https://nick-kiianovskyi.github.io/portfolio/">головну</a>
          або на
          <a href="https://nick-kiianovskyi.github.io/portfolio/en/"
            >English version</a
          >.
        </p>
        <p>
          This page does not exist. Go to the
          <a href="https://nick-kiianovskyi.github.io/portfolio/en/">home page</a
          >.
        </p>
        <div class="actions">
          <a
            class="btn btn-primary"
            href="https://nick-kiianovskyi.github.io/portfolio/"
            >На головну</a
          >
          <a
            class="btn"
            href="https://nick-kiianovskyi.github.io/portfolio/en/"
            >Home (EN)</a
          >
        </div>
      </section>
    </main>
  </body>
</html>
